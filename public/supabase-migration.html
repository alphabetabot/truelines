<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrueOddsIQ — Supabase SQL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: #0a0a0a;
      color: #f5f5f5;
    }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p, li { color: #b3b3b3; line-height: 1.6; }
    button {
      background: #f5b800;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin: 12px 0 16px;
    }
    #status { color: #4ade80; font-weight: 600; min-height: 1.5rem; }
    textarea {
      width: 100%;
      min-height: 400px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #141414;
      color: #e5e5e5;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>Supabase SQL</h1>
  <p>Supabase &rarr; SQL Editor &rarr; New query &rarr; paste &rarr; Run</p>
  <p>Expected: <strong>Success. No rows returned.</strong></p>
  <button type="button" id="copyBtn">Copy SQL</button>
  <div id="status"></div>
  <textarea id="sql" readonly spellcheck="false"></textarea>
  <script src="/supabase-migration.sql.js"></script>
  <script>
    const sql = window.SUPABASE_MIGRATION_SQL || '';
    document.getElementById('sql').value = sql;
    document.getElementById('copyBtn').onclick = async () => {
      const status = document.getElementById('status');
      try {
        await navigator.clipboard.writeText(sql);
        status.textContent = 'Copied! Paste in Supabase and click Run.';
      } catch {
        const ta = document.getElementById('sql');
        ta.focus();
        ta.select();
        status.textContent = 'Selected — press Cmd/Ctrl+C';
      }
    };
  </script>
</body>
</html>
