<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrueOddsIQ — Supabase SQL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: #0a0a0a;
      color: #f5f5f5;
    }
    h1 { font-size: 1.35rem; margin: 0 0 12px; }
    p, li { color: #b3b3b3; line-height: 1.6; }
    ol { padding-left: 1.2rem; }
    .actions { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
    button {
      background: #f5b800;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    #status {
      min-height: 1.5rem;
      color: #4ade80;
      font-weight: 600;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 420px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #141414;
      color: #e5e5e5;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>Supabase SQL — pick publish workflow</h1>
  <ol>
    <li>Go to <strong>Supabase → SQL Editor → New query</strong></li>
    <li>Click <strong>Copy SQL</strong> below</li>
    <li>Paste and click <strong>Run</strong></li>
    <li>You should see: <strong>Success. No rows returned.</strong></li>
  </ol>
  <div id="status"></div>
  <div class="actions">
    <button type="button" id="copyBtn">Copy SQL</button>
  </div>
  <textarea id="sql" readonly spellcheck="false"></textarea>
  <script>
    fetch('/supabase-migration.sql')
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(sql => { document.getElementById('sql').value = sql; window.__sql = sql; })
      .catch(() => {
        document.getElementById('status').textContent = 'Open this page from your deployed site, or copy from SUPABASE-RUN-THIS.sql in the repo.';
      });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const sql = window.__sql || document.getElementById('sql').value;
      if (!sql) return;
      const status = document.getElementById('status');
      try {
        await navigator.clipboard.writeText(sql);
        status.textContent = 'Copied! Paste into Supabase SQL Editor and click Run.';
      } catch {
        const ta = document.getElementById('sql');
        ta.focus();
        ta.select();
        status.textContent = 'Selected — press Cmd/Ctrl+C to copy.';
      }
    });
  </script>
</body>
</html>
